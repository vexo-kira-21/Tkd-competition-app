
<!DOCTYPE html>
<html>
<body>
<h1>Score Board</h1>
<h2 id="score">0 - 0</h2>

<script>
const ws = new WebSocket("ws://localhost:3000");

ws.onmessage = (event) => {
  const data = JSON.parse(event.data);
  document.getElementById("score").innerText =
    data.red + " - " + data.blue;
};
</script>
</body>
</html>
